<!DOCTYPE html>
<html lang="en">
<head>

<title>Baby Brigade</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  BABY BRIGADE — Leo & Josie vs. the Viruses (phone tower defense)
  ═══════════════════════════════════════════════════════════════════
  For adults. Commanders Leo and Josie hold a base camp against waves
  of green viruses across six wild biomes, two maps each. Every weapon
  is baby gear with a distinct tactical job; new weapons and commander
  abilities unlock as levels are cleared.

  CORE LOOP  verb: place / upgrade.  Read the next-wave preview ->
  spend puffs on the right counter -> watch it hold or leak -> adapt.
  TENSION    20 lives, tight puffs, enemy types that hard-counter lazy
  builds (armor, cloak, flyers, shields, healers, splitters, bosses).
  ESCALATION one new virus or weapon per level; biome modifiers.
  PERSIST    stars per level + unlocks in localStorage.

  PALETTE    one hand-drawn canvas style, plum ink outline, declared in P.
  FONTS      Fredoka (display) + Nunito (body).

  AUDIO IDENTITY
  - World: a toy army on expedition — squirts, plops and boings outdoors.
  - Timbre family: rubber/toy, with woody-percussive accents.
  - Key + scale: F major pentatonic for every pitched SFX and stinger.
  - Success motif: rising 1-3-5 ("up you go"). Failure: falling 5-3-1.
  - Signature sound: the rattle shake (wave start, rattle tower).
  - Music: procedural toy-piano march; root, scale and tempo change per
    biome, percussion joins while a wave is live. Ambience bed per biome.

  Single file, no build step. All sound is synthesized with Web Audio.
  ═══════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

.tg{font-size:13px;background:rgba(29,23,48,.75);border-radius:999px;padding:8px 14px;color:var(--cream)}

/* headers */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.top h2{font-size:24px;flex:1}
.back{width:44px;height:44px;border-radius:12px;background:var(--panel2);font-size:22px;box-shadow:var(--sh)}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}

/* map */

.biome h3{font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.lv{display:flex;align-items:center;gap:10px;width:100%;color:var(--cream);background:rgba(29,23,48,.86);border-radius:12px;padding:10px 12px;margin-top:6px;text-align:left;min-height:52px;box-shadow:var(--sh)}

.lv .n{font-family:Fredoka;font-size:20px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:none}
.lv .t{flex:1;font-size:15px;line-height:1.15}

.lv .st{font-size:17px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.lv .st i{font-style:normal;color:#5b5075}
.lv.locked{opacity:.55;pointer-events:none}
.lv.locked .n{background:#5b5075;color:var(--night)}
.lv.next .n{animation:pulseRing 1.3s ease-out infinite}

/* armory */
.tabs{display:flex;gap:8px;padding:0 14px 8px}
.tabs button{flex:1;padding:9px;border-radius:12px;background:var(--panel);color:var(--mute);font-family:Fredoka;font-size:16px}
.tabs button.on{background:var(--gold);color:var(--ink)}
.entry{display:flex;gap:12px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:8px;align-items:center;animation:slideUp .35s ease both}
.entry canvas{flex:none;background:var(--panel2);border-radius:12px}
.entry b{font-family:Fredoka;font-size:16px;display:block}
.entry span{font-size:12.5px;color:#d7cdea;line-height:1.3;display:block}
.entry em{font-style:normal;color:var(--gold);font-size:12px}
.entry.lock{opacity:.5}

/* game */
#sGame{background:var(--night)}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;height:46px;flex:none}
.stat{display:flex;align-items:center;gap:5px;font-family:Fredoka;font-size:21px;background:var(--panel);border-radius:999px;padding:3px 12px 3px 6px;min-width:66px}
.stat svg{width:22px;height:22px;flex:none}
.stat.p{animation:punch .25s ease}
.stat.low span{animation:danger .6s linear infinite}
#hud .sp{flex:1}
.hb{width:42px;height:38px;border-radius:11px;background:var(--panel2);font-family:Fredoka;font-size:16px;box-shadow:var(--sh)}
.hb:active{transform:translateY(2px)}
#waveRow{display:flex;align-items:center;gap:8px;padding:0 10px 6px;height:42px;flex:none}
#waveLbl{font-family:Fredoka;font-size:15px;white-space:nowrap}
#wavePrev{flex:1;display:flex;gap:6px;align-items:center;overflow:hidden;font-size:12px;color:var(--mute);height:32px}
#wavePrev .e{display:flex;align-items:center;gap:1px;color:var(--cream);font-size:12.5px;animation:popIn .3s ease both}
#wavePrev canvas{width:24px;height:24px}
#bCall{font-family:Fredoka;font-size:15px;background:var(--g2);color:var(--night);border-radius:11px;padding:7px 12px;box-shadow:0 3px 0 #2d7a22;white-space:nowrap;min-height:36px}
#bCall:active{transform:translateY(2px)}
#bCall:disabled{background:var(--panel2);color:var(--mute);box-shadow:none}
#bCall.hot{animation:pulseRing 1.2s ease-out infinite}
#fieldWrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
#cv{display:block;border-radius:10px;touch-action:none;box-shadow:0 0 0 3px var(--ink)}
#bossBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70%;height:16px;background:var(--ink);border-radius:8px;border:2px solid var(--ink);display:none;overflow:hidden}
#bossBar i{display:block;height:100%;background:linear-gradient(#c8ff5a,#57c23c);width:100%;transition:width .2s}
#bossBar b{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:13px;color:var(--ink);font-family:Fredoka}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:Fredoka;font-size:38px;color:var(--cream);text-shadow:2.5px 0.0px 0 var(--ink),2.3px 1.0px 0 var(--ink),1.8px 1.8px 0 var(--ink),1.0px 2.3px 0 var(--ink),0.0px 2.5px 0 var(--ink),-1.0px 2.3px 0 var(--ink),-1.8px 1.8px 0 var(--ink),-2.3px 1.0px 0 var(--ink),-2.5px 0.0px 0 var(--ink),-2.3px -1.0px 0 var(--ink),-1.8px -1.8px 0 var(--ink),-1.0px -2.3px 0 var(--ink),-0.0px -2.5px 0 var(--ink),1.0px -2.3px 0 var(--ink),1.8px -1.8px 0 var(--ink),2.3px -1.0px 0 var(--ink),2.5px 4.0px 0 var(--ink),2.3px 5.0px 0 var(--ink),1.8px 5.8px 0 var(--ink),1.0px 6.3px 0 var(--ink),0.0px 6.5px 0 var(--ink),-1.0px 6.3px 0 var(--ink),-1.8px 5.8px 0 var(--ink),-2.3px 5.0px 0 var(--ink),-2.5px 4.0px 0 var(--ink),-2.3px 3.0px 0 var(--ink),-1.8px 2.2px 0 var(--ink),-1.0px 1.7px 0 var(--ink),-0.0px 1.5px 0 var(--ink),1.0px 1.7px 0 var(--ink),1.8px 2.2px 0 var(--ink),2.3px 3.0px 0 var(--ink);pointer-events:none;opacity:0}
#banner.show{animation:bannerIn 1.8s ease both}
#banner small{display:block;font-size:15px;text-shadow:1.5px 0.0px 0 var(--ink),1.4px 0.6px 0 var(--ink),1.1px 1.1px 0 var(--ink),0.6px 1.4px 0 var(--ink),0.0px 1.5px 0 var(--ink),-0.6px 1.4px 0 var(--ink),-1.1px 1.1px 0 var(--ink),-1.4px 0.6px 0 var(--ink),-1.5px 0.0px 0 var(--ink),-1.4px -0.6px 0 var(--ink),-1.1px -1.1px 0 var(--ink),-0.6px -1.4px 0 var(--ink),-0.0px -1.5px 0 var(--ink),0.6px -1.4px 0 var(--ink),1.1px -1.1px 0 var(--ink),1.4px -0.6px 0 var(--ink),1.5px 2.0px 0 var(--ink),1.4px 2.6px 0 var(--ink),1.1px 3.1px 0 var(--ink),0.6px 3.4px 0 var(--ink),0.0px 3.5px 0 var(--ink),-0.6px 3.4px 0 var(--ink),-1.1px 3.1px 0 var(--ink),-1.4px 2.6px 0 var(--ink),-1.5px 2.0px 0 var(--ink),-1.4px 1.4px 0 var(--ink),-1.1px 0.9px 0 var(--ink),-0.6px 0.6px 0 var(--ink),-0.0px 0.5px 0 var(--ink),0.6px 0.6px 0 var(--ink),1.1px 0.9px 0 var(--ink),1.4px 1.4px 0 var(--ink);color:var(--gold)}
@keyframes bannerIn{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-size:13.5px;padding:7px 14px;border-radius:999px;white-space:nowrap;display:none;box-shadow:var(--sh);pointer-events:none;animation:breathe 1.4s ease-in-out infinite}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px rgba(255,60,60,.0);transition:box-shadow .4s}
#vig.on{box-shadow:inset 0 0 60px 14px rgba(255,60,60,.55)}
#abil{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 6px 2px;height:54px;flex:none}
#abil .por{width:36px;height:42px;flex:none}
.ab{width:44px;height:44px;border-radius:50%;position:relative;flex:none;background:var(--panel2);box-shadow:var(--sh);overflow:hidden}
.ab.leo{border:3px solid var(--leo)}.ab.josie{border:3px solid var(--josie)}
.ab canvas{width:100%;height:100%;display:block}
.ab .cdm{position:absolute;inset:0;background:conic-gradient(rgba(29,23,48,.82) var(--p,0%),transparent 0);pointer-events:none}
.ab .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka;font-size:15px;color:var(--milk);text-shadow:0 1px 0 #000;pointer-events:none}
.ab.ready{animation:popIn .3s ease}
.ab.aim{box-shadow:0 0 0 3px var(--gold);animation:breathe .7s ease-in-out infinite}
.ab.lockd{opacity:.3;pointer-events:none;border-color:#5b5075}
.ab:active{transform:scale(.92)}
#dock{height:98px;flex:none;position:relative;padding:0 0 4px}
#info{height:20px;font-size:12px;color:#d7cdea;padding:2px 12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info b{color:var(--gold);font-family:Fredoka;font-size:13px}
#tray{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px;scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.tw{flex:none;width:58px;height:68px;border-radius:12px;background:var(--panel);position:relative;box-shadow:var(--sh);transition:transform .12s ease,background .12s}
.tw canvas{width:46px;height:46px;display:block;margin:1px auto 0}
.tw .c{font-family:Fredoka;font-size:14px;color:var(--gold);line-height:1;display:block}
.tw.poor .c{color:var(--red)}.tw.poor canvas{filter:grayscale(.7) brightness(.75)}
.tw.sel{background:var(--panel2);transform:translateY(-5px);box-shadow:0 0 0 3px var(--gold)}
.tw.new::after{content:'NEW';position:absolute;top:-4px;right:-4px;background:var(--red);color:var(--milk);font-size:9px;font-family:Fredoka;padding:1px 5px;border-radius:8px}
.tw.tut{animation:pulseRing 1.2s ease-out infinite}
#panel{position:absolute;inset:0;background:var(--panel);border-radius:14px 14px 0 0;padding:6px 10px;display:none;animation:slideUp .18s ease}
#panel .r1{display:flex;align-items:center;gap:6px;height:30px}
#panel .nm{font-family:Fredoka;font-size:15.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .nm i{font-style:normal;color:var(--gold);font-size:13px;margin-left:4px}
.pb{font-family:Fredoka;font-size:13px;background:var(--panel2);border-radius:9px;padding:5px 9px;min-height:28px;box-shadow:var(--sh)}
.pb.sell{background:#5a2f3f}
#panel .r2{display:flex;gap:6px;margin-top:5px;height:52px}
.up{flex:1;background:var(--g2);color:var(--night);border-radius:11px;padding:4px 8px;text-align:left;line-height:1.12;box-shadow:0 3px 0 #2d7a22;overflow:hidden;min-width:0}
.up b{font-family:Fredoka;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up span{font-size:10.5px;display:block;height:23px;overflow:hidden}
.up b u{text-decoration:none;float:right;margin-left:6px}
.up.poor{background:var(--panel2);color:var(--mute);box-shadow:none}
.up.max{background:var(--panel2);color:var(--gold);box-shadow:none;display:grid;place-items:center;font-family:Fredoka}
.up:active{transform:translateY(2px)}

/* modal */
.modal{position:absolute;inset:0;background:rgba(20,15,34,.78);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;padding:18px}
.modal.on{opacity:1;pointer-events:auto}
.card{background:var(--panel);border-radius:22px;border:3px solid var(--ink);padding:18px;width:100%;max-width:400px;max-height:92%;overflow-y:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.modal.on .card{animation:popIn .35s ease both}
.card h2{font-size:30px;margin-bottom:4px}
.card p{margin:6px 0;font-size:14px;color:#d7cdea;line-height:1.35}
.card .acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card .acts.h{flex-direction:row;justify-content:center}
.stars{font-size:46px;letter-spacing:6px;color:#5b5075;height:58px}
.stars span{display:inline-block;transform:scale(0)}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 #b98522;animation:popIn .45s ease forwards}
.stars span.dim{animation:popIn .45s ease forwards}
.line{display:flex;justify-content:space-between;font-size:15px;padding:5px 8px;border-bottom:1px dashed #5b5075;opacity:0;animation:slideUp .35s ease forwards}
.line b{font-family:Fredoka;color:var(--gold)}
.note{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border-radius:14px;padding:8px 10px;margin-top:8px;opacity:0;animation:slideUp .4s ease forwards}
.note canvas{flex:none;background:var(--night);border-radius:10px}
.note b{font-family:Fredoka;font-size:15px;display:block}
.note span{font-size:12px;color:#d7cdea;line-height:1.3;display:block}
.note .k{font-size:10.5px;font-family:Fredoka;letter-spacing:.6px;color:var(--gold)}
.note .k.bad{color:var(--g1)}
@media (prefers-reduced-motion:reduce){.btn.big,#hint,.ab.aim{animation:none}}
</style>
</head>
<body>
<div id="app">

    const fresh=avail.filter(k=>L.roster[k]===w&&w>1);
    const kinds=[];if(fresh.length)kinds.push(fresh[0]);

  if(e.boss){G.bossRef=null;G.shake=14;G.hitPause=.12;sfx('bossDie');if(!G.headless)for(let i=0;i<6;i++)G.later.push({t:i*.12,kind:'show',x:e.x+rand(-26,26),y:e.y+rand(-26,26),r:30})}
}
function leak(e){e.dead=true;if(G.over)return;
  if(G.shield>0&&!e.boss){G.shield--;ringFx(G.base.x,G.base.y,34,P.josie,.4,5);burst(e.x,e.y,P.josie,10,100,{life:.5,size:4});sfx('shieldHit');return}
  const n=e.def.lives||1;G.lives=Math.max(0,G.lives-n);G.stats.leaks+=n;G.shake=Math.max(G.shake,e.boss?16:7);G.hitPause=.07;G.hurtT=.5;sfx('leak');
  burst(G.base.x,G.base.y,P.red,12,120,{life:.5,size:4});if(!G.headless)G.texts.push({x:G.base.x,y:G.base.y-26,s:'-'+n,col:P.red,t:0,size:20})}
function enemyUpdate(e,dt){
  if(e.dying>0){e.dying-=dt;if(e.dying<=0){e.dead=true;deathBurst(e)}return}
  const p=G.paths[e.path];e.wob+=dt*(3+e.spd*2.5);e.hitT-=dt;e.revealT-=dt;
  if(e.burnT>0){e.burnT-=dt;e.dotAcc+=e.burn*dt}else e.burn=0;
  if(e.sleep>0&&e.nm)e.dotAcc+=e.nm*dt;
  if(e.dotAcc>=2){const v=e.dotAcc;e.dotAcc=0;hurt(e,v,{pierce:1,dot:1});if(e.dying>0)return}
  if(e.vulnT>0)e.vulnT-=dt;
  if(G.mod.regen&&e.hp<e.max)e.hp=Math.min(e.max,e.hp+e.max*.012*dt);
  if(e.def.selfHeal&&e.hp<e.max)e.hp=Math.min(e.max,e.hp+e.max*e.def.selfHeal*dt);
  if(e.shieldMax>0&&e.shield<e.shieldMax){e.shieldT-=dt;if(e.shieldT<=0)e.shield=Math.min(e.shieldMax,e.shield+e.shieldMax*.4*dt)}
  if(e.def.heal){e.healT-=dt;if(e.healT<=0){e.healT=1;let any=0;for(const o of G.enemies)if(o!==e&&!o.dead&&o.dying<=0&&o.hp<o.max&&!(G.time-o.healAt<.95)&&Math.hypot(o.x-e.x,o.y-e.y)<72){o.healAt=G.time;o.hp=Math.min(o.max,o.hp+o.max*(o.boss?.006:.07));any=1;if(!G.headless)part(o.x,o.y-o.r,0,-30,{life:.5,size:6,col:'#aaffc8',shape:6})}if(any){ringFx(e.x,e.y,72,'#7dffb0',.5,2);sfx('heal')}}}
  if(e.boss&&e.def.spawn){e.spawnT-=dt;if(e.spawnT<=0){e.spawnT=7;const sc=G.L.hp*(1+G.L.hg*(G.L.n-1));for(let i=0;i<3;i++)spawnEnemy(e.def.spawn,e.path,sc,Math.max(0,e.d-14-i*10));ringFx(e.x,e.y,40,P.g4,.4,3);sfx('split')}}
  e.blocked=false;
  if(e.bubT>0){e.bubT-=dt;e.d=Math.max(0,e.d-e.bubV*dt);if(e.bubT<=0){sfx('bubblePop');burst(e.x,e.y-14,'#cfefff',6,70,{life:.3,size:3})}}
  else if(e.kb>0){const m=Math.min(e.kb,260*dt);e.kb-=m;e.d=Math.max(0,e.d-m)}
  else if(e.pullT>0){e.pullT-=dt;e.d+=(e.pullTo-e.d)*Math.min(1,dt*9)}
  else if(e.stun>0)e.stun-=dt;
  else if(e.sleep>0)e.sleep-=dt;
  else{let sp=e.spd*CELL*(G.mod.spd||1);if(e.slowT>0)sp*=1-e.slowF;let nd=e.d+sp*dt;
    if(!e.fly)for(const b of G.towers){if(b.kind!=='block')continue;const bd=b.pd[e.path];if(bd==null||e.d>bd-5||nd<bd-15)continue;
      nd=Math.max(e.d,Math.min(nd,bd-15));e.blocked=true;b.hp-=(e.def.bite||8)*(e.boss?1:e.scale)*dt;b.bit=.15;if(b.s.thorns)e.dotAcc+=b.s.thorns*b.dmgB*dt;if(Math.random()<dt*2)sfx('bite');break}
    e.d=nd}
  if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0}
  const q=pathPos(p,e.d);e.x=q.x-q.dy*e.off;e.y=q.y+q.dx*e.off;e.rem=p.len-e.d;

}

/* ---------- shots, zones, fx ---------- */
function addZone(z){z.t=0;if(z.kind==='puddle'||z.kind==='acid')for(const o of G.zones)if(o.kind===z.kind&&Math.hypot(o.x-z.x,o.y-z.y)<12){o.t=0;o.dur=z.dur;o.r=Math.max(o.r,z.r);o.slow=Math.max(o.slow,z.slow);o.dps=Math.max(o.dps||0,z.dps||0);return}G.zones.push(z)}
function explode(x,y,r,dmg,o){o=o||{};let n=0;for(const e of G.enemies){if(e.dead||e.dying>0||(o.ground&&e.fly))continue;const d=Math.hypot(e.x-x,e.y-y);if(d<=r+e.r*.5){hurt(e,dmg*(1-.4*Math.min(1,d/r)),o);n++}}return n}
function boomFx(x,y,r,col,heavy){if(G.headless)return;flashFx(x,y,r*.9,P.cream,.14);ringFx(x,y,r*1.15,col,.35,heavy?6:4);
  burst(x,y,col,heavy?18:10,heavy?220:150,{g:320,life:heavy?.8:.55,size:heavy?5:4});for(let i=0;i<(heavy?7:4);i++)part(x+rand(-r*.4,r*.4),y+rand(-r*.4,r*.4),rand(-18,18),rand(-34,-8),{life:rand(.5,.9),size:rand(7,13),col:'rgba(90,80,90,.55)',shape:4});
  G.decals.push({x,y,r:r*.55,col:'rgba(30,22,36,.5)',t:0,rot:rand(0,6),scorch:1});G.shake=Math.max(G.shake,heavy?6:2.5)}
function impact(s){const e=s.tgt,alive=e&&!e.dead&&e.dying<=0;
  switch(s.kind){
   case'bottle':if(alive){hurt(e,s.dmg);if(s.slow){e.slowF=Math.max(e.slowF,s.slow);e.slowT=1.2}}burst(s.x,s.y,P.milk,s.big?6:3,60,{life:.25,size:s.big?3.5:2.5});sfx('bottleHit');return true;
   case'sniper':if(alive){hurt(e,s.dmg*(e.boss?s.boss:1),{pierce:s.pierce});G.shake=Math.max(G.shake,1.5)}burst(s.x,s.y,P.rose,6,120,{life:.3,size:3});ringFx(s.x,s.y,14,P.cream,.2,2);sfx('sniperHit');return true;
   case'wipes':if(alive){let st=0;if(e.armor>0){e.armor=e.boss?e.armor*.6:0;st=1}if(e.shieldMax>0){e.shield=0;if(e.boss)e.shieldT=7;else e.shieldMax=0;st=1}if(e.cloak){e.cloak=0;st=1}if(s.mark)e.mark=Math.max(e.mark,s.mark);
       if(st){burst(e.x,e.y,P.steel,8,90,{life:.4,size:3,shape:1});ringFx(e.x,e.y,e.r+8,P.teal,.3,3);sfx('strip')}hurt(e,s.dmg)}burst(s.x,s.y,P.milk,3,50,{life:.25,size:3,shape:1});return true;
   case'ring':if(alive){hurt(e,s.dmg);if(s.slow){e.slowF=Math.max(e.slowF,s.slow);e.slowT=1.6}s.hits.push(e)}burst(s.x,s.y,P.gold,4,70,{life:.25,size:2.5});sfx('ringHit',s.bn++);
     if(s.n-->0){let best=null,bd=s.br*s.br;for(const o of G.enemies){if(o.dead||o.dying>0||s.hits.includes(o)||(o.cloak&&o.revealT<=0))continue;const d2=(o.x-s.x)**2+(o.y-s.y)**2;if(d2<bd){bd=d2;best=o}}if(best){s.tgt=best;return false}}return true}
  return true}
function land(s){const t=s.src,st=t.s,x=s.x1,y=s.y1;
  if(s.kind==='cannon'){explode(x,y,st.splash*CELL,s.dmg,{ground:1});boomFx(x,y,st.splash*CELL,'#f2ead8',st.stink);burst(x,y,'#b98a4a',st.stink?10:4,120,{g:300,life:.5,size:3.5});sfx('cannonHit');
    if(st.cluster)for(let i=0;i<st.cluster;i++){const a=rand(0,TAU),d=rand(18,34);G.later.push({t:.14+i*.07,kind:'cluster',x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,r:.75*CELL,dmg:s.dmg*.5})}
    if(st.stink)addZone({kind:'stink',x,y,r:st.splash*CELL,dur:3,dps:st.stink*t.dmgB,ground:1})}
  else if(s.kind==='mortar'){explode(x,y,st.splash*CELL,s.dmg,{ground:1});boomFx(x,y,st.splash*CELL,P.milk,1);sfx('mortarHit');G.hitPause=Math.max(G.hitPause,.03);if(st.sludge)addZone({kind:'sludge',x,y,r:st.splash*CELL*.8,dur:3.5,slow:.45,ground:1})}
  else if(s.kind==='powder'){addZone({kind:'cloud',x,y,r:st.cr*CELL,dur:st.cdur,vuln:st.vuln,dps:st.cdps*t.dmgB});for(let i=0;i<12;i++){const a=rand(0,TAU),sp=rand(20,90);part(x,y,Math.cos(a)*sp,Math.sin(a)*sp,{life:rand(.5,1),size:rand(6,12),col:'rgba(255,255,255,.6)',shape:4,drag:2.5})}}}
function shotUpdate(s,dt){
  if(s.k==='lob'){s.t+=dt;if(s.t<0)return false;const p=Math.min(1,s.t/s.dur);s.x=lerp(s.x0,s.x1,p);s.gy=lerp(s.y0,s.y1,p);s.y=s.gy-Math.sin(p*Math.PI)*s.h;s.rot+=dt*9;
    if(s.kind!=='powder'&&Math.random()<dt*30)part(s.x,s.y,0,0,{life:.3,size:3,col:'rgba(255,255,255,.5)',shape:4});if(p>=1){land(s);return true}return false}
  const e=s.tgt;if(e&&!e.dead&&e.dying<=0){s.tx=e.x;s.ty=e.y-(e.fly?16:0)}
  const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),st=s.spd*dt;if(s.rot!=null)s.rot+=dt*12;
  if(d<=st+4){s.x=s.tx;s.y=s.ty;return impact(s)}
  s.px=s.x;s.py=s.y;s.x+=dx/d*st;s.y+=dy/d*st;s.ang=Math.atan2(dy,dx);return false}
const PCAP=[420,260,150];
function part(x,y,vx,vy,o){if(G.headless||G.parts.length>PCAP[QUAL])return;G.parts.push({x,y,vx,vy,g:o.g||0,drag:o.drag||0,life:o.life||.5,max:o.life||.5,size:o.size||3,col:o.col||P.milk,shape:o.shape||0,rot:rand(0,6),vr:rand(-6,6)})}
function burst(x,y,col,n,sp,o){if(G.headless)return;o=o||{};if(G.parts.length>PCAP[QUAL]*.5)n=Math.ceil(n*.5);for(let i=0;i<n;i++){const a=rand(0,TAU),v=sp*rand(.35,1);part(x,y,Math.cos(a)*v,Math.sin(a)*v-(o.g?sp*.35:0),{g:o.g,life:(o.life||.5)*rand(.6,1),size:(o.size||3)*rand(.6,1.2),col,shape:o.shape,drag:o.drag||1.5})}}
function ringFx(x,y,r,col,dur,w){if(G.headless)return;G.fx.push({k:'ring',x,y,r,col,t:0,dur:dur||.3,w:w||3})}
function flashFx(x,y,r,col,dur){if(G.headless)return;G.fx.push({k:'flash',x,y,r,col,t:0,dur:dur||.12})}

/* ---------- waves + abilities ---------- */
function canCall(){return!G.over&&G.wave<G.waves.length&&!G.spawnQ.length}
function callBonus(){return G.wave>0&&G.nextT!=null?Math.ceil(Math.max(0,G.nextT))*2+(G.enemies.length?6:0):0}
function payClear(){if(G.cleared<G.wave){G.cleared=G.wave;const b=G.waves[G.wave-1].bonus;G.puffs+=b;G.stats.earned+=b;if(!G.headless){G.texts.push({x:FW/2,y:70,s:'Wave clear +'+b,col:P.gold,t:0,size:17});sfx('waveClear')}}}
function startWave(auto){if(!canCall())return false;const b=auto?0:callBonus();if(b){G.puffs+=b;G.stats.earned+=b;if(!G.headless)G.texts.push({x:FW/2,y:96,s:'Early call +'+b,col:P.g1,t:0,size:15})}
  payClear();const w=G.waves[G.wave];G.wave++;G.spawnQ=w.sp.slice();G.waveT=0;G.nextT=null;G.banner={h:'Wave '+G.wave,s:G.wave===G.waves.length?'Final wave':''};sfx('waveStart');Snd.setHot(1);return true}
function castAbility(id,x,y){const a=ABIL[id];if(G.over||G.cd[id]>0||!abilUnlocked(id))return false;const cs=curScale();G.cd[id]=a.cd;G.cast[a.who]=1;
  const lx=G.base.x+(a.who==='leo'?-24:24),ly=G.base.y;
  switch(id){
   case'cry':for(const e of G.enemies)hurt(e,TUNE.cry*cs);for(let i=0;i<4;i++)G.later.push({t:i*.12,kind:'wave',x:lx,y:ly,r:560,col:P.leo});G.shake=9;sfx('cry');break;
   case'tantrum':G.tantrum=6;for(const t of G.towers)if(t.kind!=='block')ringFx(t.x,t.y,24,P.red,.5,3);sfx('tantrum');G.shake=5;break;
   case'strike':for(let i=0;i<5;i++){const bx=clamp(x+(i-2)*36,10,FW-10);G.later.push({t:.55+i*.13,kind:'bomb',x:bx,y,r:1.3*CELL,dmg:TUNE.strike*cs});G.fx.push({k:'drop',x:bx,y,t:-i*.13,dur:.55})}sfx('strikeCall');break;
   case'nap':for(const e of G.enemies){stunE(e,3);if(!G.headless)part(e.x,e.y-e.r,rand(-8,8),-26,{life:1.1,size:9,col:P.sky,shape:7})}ringFx(lx,ly,520,P.josie,.9,5);sfx('nap');break;
   case'blankie':G.shield=5;ringFx(G.base.x,G.base.y,46,P.josie,.6,6);sfx('blankie');break;
   case'stroller':{const hit=new Set();G.paths.forEach((p,i)=>G.strollers.push({p:i,d:p.len-8,hit,dmg:TUNE.stroller*cs}));sfx('stroller');break}
  }return true}
function laterRun(l){
  if(l.kind==='bomb'){explode(l.x,l.y,l.r,l.dmg,{});boomFx(l.x,l.y,l.r,'#ffb347',1);burst(l.x,l.y,'#ff8a3d',10,160,{g:260,life:.6,size:4});sfx('strikeHit')}
  else if(l.kind==='cluster'){explode(l.x,l.y,l.r,l.dmg,{ground:1});boomFx(l.x,l.y,l.r,'#f2ead8');sfx('cannonHit')}
  else if(l.kind==='blast'){explode(l.x,l.y,l.r,l.dmg,{});boomFx(l.x,l.y,l.r,'#c8ff5a',1);sfx('blast')}
  else if(l.kind==='wave')ringFx(l.x,l.y,l.r,l.col,.8,6);
  else if(l.kind==='show'){boomFx(l.x,l.y,l.r,P.g4,1);sfx('splat')}
  else if(l.kind==='rock'){const t=l.tw;if(G.towers.includes(t)){t.dis=4.5;boomFx(t.x,t.y,30,'#ff7a3d',1);sfx('erupt')}}
}

/* ---------- main step ---------- */
function step(dt){
  const g=G;g.time+=dt;
  if(g.spawnQ.length){g.waveT+=dt;while(g.spawnQ.length&&g.spawnQ[0].t<=g.waveT){const s=g.spawnQ.shift();spawnEnemy(s.k,s.p,s.hp).bm=s.bm||1}if(!g.spawnQ.length&&g.wave<g.waves.length)g.nextT=18}
  else if(g.nextT!=null&&g.wave>0&&g.wave<g.waves.length&&!g.over){g.nextT-=dt;if(g.nextT<=0)startWave(true)}
  for(const k in g.cd)if(g.cd[k]>0)g.cd[k]=Math.max(0,g.cd[k]-dt);
  if(g.tantrum>0)g.tantrum-=dt;if(g.hurtT>0)g.hurtT-=dt;g.cast.leo=Math.max(0,g.cast.leo-dt*1.4);g.cast.josie=Math.max(0,g.cast.josie-dt*1.4);
  for(let i=0;i<g.enemies.length;i++)enemyUpdate(g.enemies[i],dt);
  for(const t of g.towers){const n=g.shots.length;g.src=t;towerUpdate(t,dt);for(let i=n;i<g.shots.length;i++)g.shots[i].src=t}g.src=null;
  for(let i=g.towers.length-1;i>=0;i--){const t=g.towers[i];if(t.kind==='block'){if(t.bit>0)t.bit-=dt;if(t.hp<=0){g.towers.splice(i,1);burst(t.x,t.y,P.gold,12,130,{g:300,life:.6,size:5,shape:1});burst(t.x,t.y,P.leo,6,110,{g:300,life:.6,size:5,shape:1});sfx('blockBreak');g.dirty=true}}}
  for(let i=g.shots.length-1;i>=0;i--){g.src=g.shots[i].src;if(shotUpdate(g.shots[i],dt))g.shots.splice(i,1)}g.src=null;
  // zones
  g.tickT-=dt;const tick=g.tickT<=0;if(tick)g.tickT+=.25;
  for(let i=g.zones.length-1;i>=0;i--){const z=g.zones[i];z.t+=dt;if(z.t>=z.dur){g.zones.splice(i,1);continue}const r2=z.r*z.r;
    for(const e of g.enemies){if(e.dead||e.dying>0||(z.ground&&e.fly))continue;const dx=e.x-z.x,dy=e.y-z.y;if(dx*dx+dy*dy>r2)continue;
      if(z.slow&&z.slow>=e.slowF){e.slowF=z.slow;e.slowT=.3}if(z.vuln){e.vuln=Math.max(e.vulnT>0?e.vuln:0,z.vuln);e.vulnT=.3}if(tick&&z.dps)hurt(e,z.dps*.25,{dot:1})}}
  for(let i=g.later.length-1;i>=0;i--){const l=g.later[i];l.t-=dt;if(l.t<=0){g.later.splice(i,1);laterRun(l)}}
  for(let i=g.strollers.length-1;i>=0;i--){const s=g.strollers[i];s.d-=5.5*CELL*dt;for(const e of g.enemies){if(e.dead||e.dying>0||e.fly||e.path!==s.p||s.hit.has(e)||Math.abs(e.d-s.d)>20)continue;s.hit.add(e);hurt(e,s.dmg,{pierce:1});e.kb=Math.max(e.kb,e.boss?10:46);burst(e.x,e.y,P.josie,6,120,{life:.4,size:3});sfx('strollerHit');g.shake=Math.max(g.shake,3)}
    if(Math.random()<dt*25){const q=pathPos(g.paths[s.p],s.d);part(q.x,q.y+6,rand(-20,20),rand(-10,10),{life:.45,size:rand(5,9),col:'rgba(220,210,190,.5)',shape:4})}if(s.d<=-20)g.strollers.splice(i,1)}
  if(g.mod.erupt&&g.enemies.length&&!g.over){g.eruptT-=dt;if(g.eruptT<=0){g.eruptT=rand(15,23);const c=g.towers.filter(t=>t.kind!=='block'&&t.dis<=0);if(c.length){const t=c[Math.random()*c.length|0];g.fx.push({k:'warn',x:t.x,y:t.y,t:0,dur:1.7});g.later.push({t:1.7,kind:'rock',tw:t})}}}
  // fx
  for(let i=g.parts.length-1;i>=0;i--){const p=g.parts[i];p.life-=dt;if(p.life<=0){g.parts[i]=g.parts[g.parts.length-1];g.parts.pop();continue}p.vy+=p.g*dt;if(p.drag){const f=Math.max(0,1-p.drag*dt);p.vx*=f;p.vy*=f}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  for(let i=g.fx.length-1;i>=0;i--){const f=g.fx[i];f.t+=dt;if(f.t>=f.dur)g.fx.splice(i,1)}
  for(let i=g.texts.length-1;i>=0;i--){const t=g.texts[i];t.t+=dt;if(t.t>1.1)g.texts.splice(i,1)}
  for(let i=g.decals.length-1;i>=0;i--){const d=g.decals[i];d.t+=dt;if(d.t>7)g.decals.splice(i,1)}if(g.decals.length>40)g.decals.splice(0,g.decals.length-40);
  let w=0;for(let i=0;i<g.enemies.length;i++){const e=g.enemies[i];if(!e.dead)g.enemies[w++]=e}g.enemies.length=w;
  if(g.shake>0)g.shake=Math.max(0,g.shake-dt*28);

  else if(z.kind==='stink'){c.fillStyle='rgba(150,140,60,.3)';c.beginPath();c.arc(0,0,z.r,0,TAU);c.fill();c.strokeStyle='rgba(190,200,90,.7)';c.lineWidth=1.5;for(let i=-1;i<=1;i++){c.beginPath();for(let k=0;k<=8;k++){const yy=6-k*4-((time*18)%8),xx=i*12+Math.sin(k*1.2+time*4)*3;k?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()}}

    c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-z.r*.3,-z.r*.25,z.r*.22,z.r*.1,-.4,0,TAU);c.fill();if(z.kind==='acid')for(let i=0;i<3;i++){const p=(time*1.2+i*.33)%1;c.globalAlpha=a*(1-p);c.beginPath();c.arc(-8+i*8,4-p*10,1.5+p*2,0,TAU);c.fill()}}

function drawShot(c,s){

function drawPart(c,p){
  const a=Math.min(1,p.life/p.max*1.6);c.globalAlpha=a;c.fillStyle=p.col;const s=p.size;
  switch(p.shape){
   case 1:c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-s/2,-s/2,s,s);c.restore();break;
   case 2:c.save();c.translate(p.x,p.y);c.beginPath();c.ellipse(-s*.2,s*.35,s*.32,s*.24,-.3,0,TAU);c.fill();c.fillRect(s*.05,-s*.5,s*.12,s*.85);c.fillRect(s*.05,-s*.5,s*.4,s*.16);c.restore();break;
   case 3:star(c,p.x,p.y,s*1.2,p.col,0);break;
   case 4:c.beginPath();c.arc(p.x,p.y,s*(1.6-p.life/p.max),0,TAU);c.fill();break;
   case 5:c.strokeStyle=p.col;c.lineWidth=1.2;c.beginPath();c.arc(p.x,p.y,s,0,TAU);c.stroke();break;
   case 6:c.fillRect(p.x-s*.15,p.y-s*.5,s*.3,s);c.fillRect(p.x-s*.5,p.y-s*.15,s,s*.3);break;
   case 7:c.font='700 '+Math.round(s*1.4)+'px Fredoka';c.fillText('z',p.x,p.y);break;
   default:c.beginPath();c.arc(p.x,p.y,s*(.4+.6*p.life/p.max),0,TAU);c.fill()}
}

  else if(f.k==='warn'){c.globalAlpha=.4+.4*Math.sin(time*18);c.strokeStyle=P.red;c.lineWidth=2.5;c.setLineDash([6,5]);c.beginPath();c.arc(f.x,f.y,22,0,TAU);c.stroke();c.setLineDash([]);c.globalAlpha=1;c.save();c.translate(f.x,f.y-(1-p*p)*340);c.rotate(p*5);ink(c,1.6);poly(c,[-8,6,-7,-5,1,-9,8,-3,7,7],'#3a2c33');c.fillStyle='#ff7a2a';c.beginPath();c.arc(0,0,3,0,TAU);c.fill();c.restore()}

function drawStroller(c,s,time){const q=pathPos(G.paths[s.p],Math.max(0,s.d));c.save();c.translate(q.x,q.y);c.fillStyle='rgba(20,15,30,.25)';c.beginPath();c.ellipse(0,10,15,5,0,0,TAU);c.fill();c.scale(q.dx>0?-1:1,1);c.rotate(Math.sin(time*40)*.06);ink(c,1.8);

function titleFit(){const c=$('titleCv'),d=Math.min(2,window.devicePixelRatio||1);tW=c.clientWidth;tH=c.clientHeight;c.width=tW*d;c.height=tH*d;tcx=c.getContext('2d');tcx.setTransform(d,0,0,d,0,0);

  c.fillStyle='#2f7a45';c.beginPath();c.ellipse(tW/2,gy+120,tW*.9,150,0,0,TAU);c.fill();c.fillStyle='#3f8f4f';c.beginPath();c.ellipse(tW/2,gy+135,tW*.8,140,0,0,TAU);c.fill();
  const ang=tAim?Math.atan2(tAim.y*tH-by,tAim.x*tW-bx):-.9+Math.sin(t)*.15;

function buildMap(){

function frame(ts){

  if(cur==='sTitle'){titleDraw(dt);return}
  if(cur!=='sGame'||!G)return;
  if(!G.paused&&!modalOpen){if(G.hitPause>0)G.hitPause-=dt;else for(let i=0;i<G.speed;i++)step(dt);
    const raw=ts-prevTs;if(raw>0&&raw<400){fAvg+=(raw-fAvg)*.05;slowT=fAvg>23?slowT+raw:Math.max(0,slowT-raw*2);if(slowT>2500&&QUAL<2){QUAL++;slowT=0;fAvg=16;fit()}}}
  prevTs=ts;
  render(G.paused||modalOpen?0:dt);hud.update(dt);
  if(G.over&&!G.shown&&G.overT>(G.over==='win'?1.1:1.4)){G.shown=1;showResult()}
}

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{sfx('tick');buildArmory(b.dataset.tab)});
  $('bPause').onclick=pauseMenu;$('bSpd').onclick=()=>{G.speed=G.speed%3+1;$('bSpd').textContent=G.speed+'x';sfx('tick')};
  $('bCall').onclick=()=>{if(startWave(false)){if(!save.tut){save.tut=1;persist()}}};
  const c=$('cv');c.addEventListener('pointerdown',fDown);c.addEventListener('pointermove',fMove);window.addEventListener('pointerup',fUp);window.addEventListener('pointercancel',()=>{pDown=false;pConfirm=false});
  window.addEventListener('resize',()=>{titleFit();fit()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(cur==='sGame')pauseMenu();Snd.suspend()}else if(cur!=='sGame'||!G||!G.paused)Snd.resume()});
  document.addEventListener('keydown',e=>{if(cur!=='sGame'||!G)return;if(e.key==='Escape'){if(modalOpen&&G.paused){G.paused=false;closeModal()}else pauseMenu()}else if(e.key===' '&&!modalOpen){e.preventDefault();$('bCall').click()}});
  document.addEventListener('pointerdown',()=>{Snd.init();if(cur!=='sGame')Snd.startMenu()});
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
