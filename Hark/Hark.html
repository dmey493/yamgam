<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hark!</title>
<!--
BUILD SIGNATURE (v3)
Reference:      none. v2 riffed on Duolingo; the user found it sloppy, so this is a library build.
UI world:       Swiss Grid, as an Advent calendar
  Native parts:   numbered calendar doors on a strict 4-column grid; a three-cell stat strip with
                  big numerals; hairline rules under small-caps labels; a door that swings open
  Invented detail: Hark the aardvark stands on the edge of the red header and toots his snout
  Type:           Bricolage Grotesque (display, tight) + Figtree (body), system fallbacks
  Colour:         gold type on every dark field (green, red, blue); ink type on white, cream
                  and gold fields. Flat fields: red, deep green, gold, night blue and cream. Each step of the
                  night has its own field; each week has its own colour on the calendar
  Depth + texture: flat. No shadows, no gradients, 2px ink rules
  Icons:          none; numerals and words
UX shape:       Board (dark green field; white doors to do, red doors done, bright green tonight) (the whole season on one calendar) + One Thing Per Screen for a night
  Navigation:     three text tabs under a rule
  Main input:     tap a door; one button per screen
  Density:        comfortable
Motion flavor:  Precision with spring accents
  Easing + tempo: ease-out 120 to 350 ms; small overshoot on arrivals
  Press feel:     ink ripple from the touch point; doors tilt on their hinge
  Micro:          words arrive one by one; the progress segment fills; numbers count up;
                  the reading highlight sweeps; a finished door flips and its check draws
  Signature moment: the calendar door swinging open on its hinge; tapping a date zooms
                  that door out to fill the screen, and finishing shrinks back into it
  Sound/haptics:  short chimes, vibration on the door
  Step change:    Hark carries each step in: he runs a colour across, turns a page, pulls a
                  blind down, or pushes the gift door into place
  Idle life:      Hark breathing; tonight's door breathes and glints; the gift door nudges;
                  the prayer candle flickers
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tonight:#18A957;--red:#D62828;--green:#0F5C3F;--gold:#FFC83D;--blue:#1B2A4E;--cream:#FFF4DC;--ink:#141414;--mute:#77726A;--line:#E6E2DA;
--disp:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--body);font-weight:500;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;letter-spacing:-.03em;line-height:1}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.cap{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
/* press + ripple, shared */
.btn,.door,.tab,.mini,.card{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn{display:block;width:100%;height:58px;border-radius:10px;background:var(--btnbg,var(--ink));color:var(--btnfg,#fff);font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;transition:transform .12s ease-out}
.btn:active{transform:scale(.97)}
.btn.white{background:#fff;color:var(--ink)}
.btn.line{background:transparent;color:var(--fg,var(--ink));box-shadow:inset 0 0 0 2px currentColor}
.btn.small{width:auto;height:48px;padding:0 18px;display:inline-block;font-size:13px}
.view{flex:1;overflow-y:auto;min-height:0}
.view.swap>*{animation:rise .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* words that arrive one by one */
.wd{display:inline-block;opacity:0;transform:translateY(.45em) rotate(2deg);animation:word .34s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--d)*1ms)}
@keyframes word{to{opacity:1;transform:none}}
/* home */
.hero{background:var(--red);color:#fff;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero h1{font-size:64px;letter-spacing:-.05em;position:relative}
.hero .cap{display:block;margin-top:12px;opacity:.95;position:relative}
.hero .btn{margin-top:20px;width:calc(100% - 132px)}
.hero svg{position:absolute;right:2px;bottom:0;width:150px;height:101px;cursor:pointer}
.ghost{position:absolute;right:-14px;top:-46px;font-family:var(--disp);font-weight:800;font-size:260px;letter-spacing:-.08em;line-height:1;color:#B81F1F;animation:ghost .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ghost{from{transform:translateX(60px);opacity:0}}
.stats{display:grid;grid-template-columns:1fr;border-bottom:2px solid var(--ink)}
.stats div{padding:12px 20px 10px}
.stats div+div{border-left:2px solid var(--ink)}
.stats b{display:block;font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1;color:var(--red)}
.stats div:nth-child(2) b{color:var(--green)}.stats div:nth-child(3) b{color:var(--blue)}
.stats b.punch{animation:punch .4s cubic-bezier(.2,.9,.3,1.6)}
@keyframes punch{40%{transform:scale(1.25)}}
.stats span{display:block;margin-top:4px;color:var(--mute)}
.wk{padding:26px 20px 0}
.wk:last-child{padding-bottom:28px}
.wk header{display:flex;justify-content:space-between;align-items:baseline;border-top:5px solid var(--wk);padding-top:10px}
.wk h2{font-size:24px}
.wk header span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.door{aspect-ratio:1;border-radius:8px;background:color-mix(in srgb,var(--wk) 13%,#fff);color:color-mix(in srgb,var(--wk) 45%,#fff);display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px;text-align:left;transition:transform .14s ease-out}
.fresh .door{animation:tile .34s cubic-bezier(.2,.9,.3,1.35) backwards;animation-delay:calc(var(--i)*16ms)}
@keyframes tile{from{opacity:0;transform:scale(.8)}}
.door:active{transform:perspective(300px) rotateY(-14deg) scale(.97);transform-origin:left}
.door.w{grid-column:span 2;aspect-ratio:auto}
.door b{font-family:var(--disp);font-weight:800;font-size:36px;letter-spacing:-.05em;line-height:.9}
.door span{font-size:10px;letter-spacing:.1em}
.door.open{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--wk)}
.door.done{background:var(--wk);color:var(--wkfg)}
.door.done svg{position:absolute;right:8px;bottom:8px;width:18px;height:18px}
.door.done path{stroke-dasharray:30;stroke-dashoffset:0}
.door.flip{animation:flip .55s cubic-bezier(.3,.9,.3,1.2) .35s backwards}
.door.flip path{animation:draw .35s ease-out .8s backwards}
@keyframes flip{from{transform:perspective(400px) rotateY(90deg);background:#fff}}
@keyframes draw{from{stroke-dashoffset:30}}
.door.now{background:var(--tonight);color:#fff;animation:breathe 1.8s ease-in-out infinite}
.door.now:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.door.nope{animation:nope .32s}
@keyframes nope{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);background:#fff;padding-bottom:env(safe-area-inset-bottom);position:relative}
.tab{height:56px;color:var(--mute);transition:color .2s}
.tab.on{color:var(--ink)}
.ind{position:absolute;top:-2px;left:0;width:33.334%;height:5px;background:var(--red);transition:transform .26s cubic-bezier(.3,.9,.3,1.2)}
/* cards + extras */
.page{padding:26px 20px 30px}
.page h1{font-size:52px;letter-spacing:-.05em}
.page>.cap{display:block;color:var(--mute);margin-top:10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.card{border-radius:8px;background:var(--wk);color:var(--wkfg);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px;text-align:left;transition:transform .14s ease-out;animation:tile .3s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--i)*14ms)}
.card:active{transform:rotate(-2deg) scale(.97)}
.card .cap{font-size:10px;opacity:.85}
.card .m{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1.08;letter-spacing:-.02em;flex:1}
.card .c{font-size:12px;font-weight:700;opacity:.85}
.card.locked{background:color-mix(in srgb,var(--wk) 13%,#fff);color:color-mix(in srgb,var(--wk) 45%,#fff);justify-content:flex-start}
.card.locked b{font-family:var(--disp);font-weight:800;font-size:36px;letter-spacing:-.05em;line-height:.9}
.sec{border-top:5px solid var(--sc,var(--ink));margin-top:28px;padding-top:12px}
.sec h2{font-size:24px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=time],textarea{font:inherit;font-weight:700;border:0;box-shadow:inset 0 0 0 2px var(--fg,var(--ink));border-radius:8px;padding:10px 12px;background:transparent;min-height:48px;color:inherit;transition:box-shadow .15s}
input[type=time]:focus,textarea:focus{outline:0;box-shadow:inset 0 0 0 4px var(--acc,var(--red))}
textarea{width:100%;min-height:84px;resize:vertical}
textarea::placeholder{color:inherit;opacity:.6}
.note{font-size:14px;color:var(--mute);font-weight:600;margin:10px 0 0;line-height:1.4}
/* timeline: horizontal strip */
.tlx{overflow-x:auto;overflow-y:hidden;margin:0 -20px;padding:4px 20px 22px;cursor:grab;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-user-select:none;user-select:none;scroll-padding:0 20px}
.tlx.drag{cursor:grabbing;scroll-snap-type:none}.tlx.drag .tlc{pointer-events:none}
.tlrow{display:flex;align-items:stretch;gap:12px;width:max-content;position:relative;padding:44px 20px 0 0}
.tlrow:before{content:"";position:absolute;left:0;right:0;top:31px;height:3px;border-radius:2px;background:var(--gold)}
.tle{flex:0 0 auto;align-self:flex-start;position:relative;margin:-44px 0 0;padding:3px 9px;border-radius:99px;background:var(--gold);color:var(--ink);top:21px;height:max-content}
.tlc{flex:0 0 218px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px 16px 14px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.3,1.4),box-shadow .18s}
.tlc:before{content:"";position:absolute;left:18px;top:-19px;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.tlc:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}.tlc:active{transform:scale(.97)}
.tlc .yr{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--red);line-height:1}
.tlc .nm{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.tlc .pl{font-size:13px;font-weight:700;color:var(--mute)}
.tlc .ms{font-size:14px;font-weight:600;line-height:1.35;flex:1}
.tlc .more{color:var(--green);margin-top:4px}
/* person sheet */
.whov{position:fixed;inset:0;z-index:60;background:rgba(14,30,22,.6);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 0 0}
.whos{position:relative;width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;transform-origin:0 0;overscroll-behavior:contain}
@media (min-width:600px){.whov{align-items:center;padding:24px}.whos{border-radius:22px}}
.whos .x{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border-radius:50%;background:var(--cream);border:2px solid var(--ink);display:grid;place-items:center;cursor:pointer}
.wmap{position:relative;height:clamp(200px,34vh,300px);background:var(--green);overflow:hidden}
.wmap svg{width:100%;height:100%;display:block}
.wmap .sea{fill:var(--green)}.wmap .land{fill:#FFF4DC;stroke:#0b4a32;stroke-width:.4;vector-effect:non-scaling-stroke}
.wmap .pd{fill:var(--red);stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
.wmap .pr{fill:none;stroke:var(--red);stroke-width:2;vector-effect:non-scaling-stroke;opacity:0}
.wmap .pin.drop .pr{animation:pinring 1.6s ease-out infinite}
.wmap .pin.drop .pd{animation:pindrop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pinring{0%{opacity:.9;r:4.5}100%{opacity:0;r:22}}
@keyframes pindrop{0%{transform:translateY(-14px) scale(.6)}100%{transform:none}}
.wplace{position:absolute;left:16px;bottom:14px;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px}
.wbody{padding:20px 22px 28px}
.wbody h2{font-size:34px;letter-spacing:-.04em;margin:6px 0 4px;line-height:1}
.wbody .wrole{display:block;color:var(--red);font-size:15px;margin-bottom:12px}
.wbody p{font-size:17px;line-height:1.55;margin:0}
.wn{margin-top:18px;display:grid;gap:10px}.wn div{border-top:2px solid var(--ink);padding-top:10px}.wn b{display:block;font-size:16px;margin-top:4px}
.tl div{padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;display:grid;grid-template-columns:92px 1fr;gap:10px}
.tl b{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;color:var(--blue)}
.tl i{font-style:normal;color:var(--mute);display:block;font-size:13px}
/* night: every step has its own colour field */
.night{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .4s ease,color .3s;
 --bg:#fff;--fg:var(--ink);--acc:var(--red);--rule:var(--ink);--sub:var(--mute);--btnbg:var(--ink);--btnfg:#fff;--off:rgba(20,20,20,.14)}
.night.t-verse{--bg:var(--green);--fg:#fff;--acc:var(--gold);--rule:rgba(255,255,255,.5);--sub:rgba(255,255,255,.8);--btnbg:#fff;--btnfg:var(--ink);--off:rgba(255,255,255,.28)}
.night.t-idea,.night.t-gift{--bg:var(--red);--fg:#fff;--acc:var(--gold);--rule:rgba(255,255,255,.5);--sub:rgba(255,255,255,.85);--btnbg:#fff;--btnfg:var(--ink);--off:rgba(255,255,255,.3)}
.night.t-teach{--bg:var(--cream);--acc:var(--red);--sub:#7a6a45}
.night.t-hymn{--bg:var(--gold);--acc:#8E1B1B;--sub:#5c4500;--off:rgba(20,20,20,.2)}
.night.t-prayer{--bg:var(--blue);--fg:#fff;--acc:var(--gold);--rule:rgba(255,255,255,.45);--sub:rgba(255,255,255,.8);--btnbg:var(--gold);--btnfg:var(--ink);--off:rgba(255,255,255,.25)}
.night.t-done{--bg:var(--green);--fg:#fff;--acc:var(--gold);--rule:rgba(255,255,255,.5);--sub:rgba(255,255,255,.8);--btnbg:#fff;--btnfg:var(--ink);--off:rgba(255,255,255,.28)}
.night .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:16px;padding:14px 20px 0}
.x{width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;transition:transform .2s}
.x:active{transform:rotate(90deg) scale(.9)}
.x svg{width:22px;height:22px}
.seg{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg i{height:5px;background:var(--off);position:relative;overflow:hidden;border-radius:3px}
.seg i.on:after{content:"";position:absolute;inset:0;background:var(--fg);border-radius:3px}
.seg i.cur:after{background:var(--acc);transform-origin:left;animation:fill .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.step{padding:6px 20px 0;color:var(--acc);animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
.stage{flex:1;overflow-y:auto;padding:14px 20px 20px;min-height:0;animation:slide .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(34px)}}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:2px solid var(--rule);animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.verse{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1.28;letter-spacing:-.02em;margin:6px 0 22px}
.under{display:block;border-top:2px solid var(--rule);padding-top:10px;color:var(--sub);animation:rise .4s .3s both}
.idea{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.045em;margin:10px 0 30px}
.who{display:flex;align-items:center;gap:6px;padding-bottom:10px}
.who b{flex:1;font-weight:800;font-size:16px;line-height:1.2}
.mini{min-width:52px;height:44px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:8px;box-shadow:inset 0 0 0 2px currentColor;transition:transform .12s}
.mini:active{transform:scale(.92)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.rp{height:5px;background:var(--off);border-radius:3px;margin-bottom:18px;overflow:hidden}
.rp i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .5s ease-out}
.read{font-size:var(--fs,20px);line-height:1.6;font-weight:500;transition:font-size .25s cubic-bezier(.3,.9,.3,1.4)}
.read p{margin:0 0 18px}
.read span{transition:color .3s;background:linear-gradient(var(--gold),var(--gold)) no-repeat left/0 100%;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:3px}
.read span.cur{animation:sweep .45s ease-out forwards;color:var(--ink)}
@keyframes sweep{to{background-size:100% 100%}}
.read span.past{color:var(--green)}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:14px;margin-right:10px;vertical-align:-1px}
.eq i{width:4px;background:currentColor;border-radius:1px;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.5s}
@keyframes eq{from{height:3px}to{height:14px}}
.hymn h3{font-size:38px;letter-spacing:-.04em;margin:6px 0 22px}
.hymn .cap{color:var(--acc)}
.hymn p{white-space:pre-line;font-size:20px;line-height:1.5;font-weight:600;margin:8px 0 26px;animation:rise .4s both;animation-delay:calc(var(--i)*120ms + 200ms)}
.flame{width:44px;height:64px;display:block;margin:2px 0 6px}
.flame path{transform-origin:22px 46px;animation:flick 1.1s ease-in-out infinite alternate}
.flame path+path{animation-duration:.7s}
@keyframes flick{from{transform:scale(1,1) skewX(0)}50%{transform:scale(.94,1.06) skewX(-3deg)}to{transform:scale(1.03,.96) skewX(3deg)}}
.pprompt{font-family:var(--disp);font-weight:800;font-size:32px;line-height:1.04;letter-spacing:-.035em;margin:6px 0 20px}
.ptext{font-size:19px;line-height:1.55;font-weight:500;border-left:4px solid var(--acc);padding-left:14px;margin:0 0 20px;animation:rise .4s .35s both}
/* gift */
.giftbox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;touch-action:manipulation;user-select:none;perspective:900px}
.frame{width:230px;height:230px;background:var(--gold);border-radius:10px;position:relative;animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,82%,100%{transform:none}86%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}94%{transform:rotate(-2deg)}}
.frame:before{content:"";position:absolute;inset:0;margin:auto;width:64px;height:64px;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twirl 6s linear infinite}
@keyframes twirl{to{transform:rotate(360deg)}}
.leaf{position:absolute;inset:0;background:#fff;color:var(--red);border-radius:10px;transform-origin:left center;transition:transform .2s cubic-bezier(.3,.9,.3,1.5);display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px;backface-visibility:hidden}
.leaf b{font-family:var(--disp);font-weight:800;font-size:150px;letter-spacing:-.07em;line-height:.8}
.leaf span{color:var(--ink)}
.leaf.swing{transition:transform .45s cubic-bezier(.3,0,.2,1);transform:rotateY(-112deg)!important}
.hint{margin-top:26px;animation:hintp 1.4s ease-in-out infinite}
@keyframes hintp{50%{opacity:.55}}
.ring{width:230px;height:5px;background:rgba(255,255,255,.3);margin-top:14px;border-radius:3px;overflow:hidden}
.ring i{display:block;height:100%;width:0;background:var(--gold)}
.flash{position:fixed;inset:0;background:#fff;z-index:50;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.prize .card{animation:cardup .55s cubic-bezier(.2,.9,.3,1.3) both;transform-origin:bottom;background:#fff;color:var(--ink);min-height:0;padding:18px;gap:14px}
@keyframes cardup{from{transform:perspective(600px) rotateX(70deg) translateY(40px);opacity:0}}
.prize .card .m{font-size:30px;line-height:1.02;letter-spacing:-.035em}
.prize .card .cap{font-size:11px;color:var(--red);opacity:1}
.also{border-top:2px solid rgba(255,255,255,.5);margin-top:22px;padding-top:12px;font-weight:600;font-size:17px;line-height:1.45;animation:rise .4s .45s both}
.also .cap{display:block;margin-bottom:6px;color:var(--gold)}
/* done */
.done h2{font-size:56px;letter-spacing:-.05em;margin:0 0 18px}
.done h2{transform-origin:0 80%}.done h2.beat{animation:beatp .34s cubic-bezier(.2,.9,.3,1.4)}
@keyframes beatp{0%{transform:scale(var(--bs,1.1)) rotate(-1.5deg)}100%{transform:none}}
.harkbig{width:230px;height:170px;display:block;margin:10px 0 0 -14px;touch-action:manipulation}
.done .stats{border-top:2px solid var(--rule);border-bottom-color:var(--rule);margin:0 -20px}
.done .stats div+div{border-left-color:var(--rule)}
.done .stats b,.done .stats div:nth-child(n) b{color:var(--gold)}
.done .stats span{color:var(--sub)}

/* rumble */
@keyframes shake{0%,100%{transform:none}15%{transform:translate(calc(var(--amp)*-1),calc(var(--amp)*.6)) rotate(-.7deg)}30%{transform:translate(var(--amp),calc(var(--amp)*-.5)) rotate(.7deg)}45%{transform:translate(calc(var(--amp)*-.8),calc(var(--amp)*-.4))}60%{transform:translate(calc(var(--amp)*.7),calc(var(--amp)*.5)) rotate(-.4deg)}80%{transform:translate(calc(var(--amp)*-.4),0)}}
.shake{animation:shake .34s linear}
.quake{animation:shake .15s linear 7}
/* a wrapped week */
.box{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;width:100%;height:170px;border-radius:10px;background:var(--wk);color:var(--wkfg);padding:16px;text-align:left;position:relative;overflow:hidden;margin-top:4px;transition:transform .14s ease-out}
.box:active{transform:scale(.98)}
.box b{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1;position:relative}
.box .cap{position:relative;opacity:.9}
.box .rv,.box .rh{position:absolute;background:rgba(255,255,255,.28)}
.box .rv{top:0;bottom:0;right:64px;width:26px}.box .rh{left:0;right:0;top:44px;height:26px}
.box .bow{position:absolute;right:51px;top:31px;width:52px;height:52px;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.box.ready{animation:nudge 2.2s ease-in-out infinite}
.box.ready .bow{animation:twirl 5s linear infinite}
.box.nope{animation:nope .32s}
.box.burst{animation:pump .5s ease-in forwards}
@keyframes pump{40%{transform:scale(1.06) rotate(-1.5deg)}70%{transform:scale(1.1) rotate(1.5deg)}100%{transform:scale(.6);opacity:0}}
.wk.unwrapped .door{animation:tile .4s cubic-bezier(.2,.9,.3,1.5) backwards;animation-delay:calc(var(--i)*55ms)}
.wk.unwrapped header{animation:rise .35s both}
/* Hark on each step */
.step{display:flex;justify-content:space-between;align-items:flex-end;min-height:58px}
.step .hk{width:92px;height:62px;margin:-8px -6px -4px 0;flex:none}
/* gift stage */
.gstage{position:relative;width:230px;height:230px}
.ghark{position:absolute;left:-92px;bottom:-22px;width:170px;height:115px;z-index:2;pointer-events:none}
.frame.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1.6)}
@keyframes bump{35%{transform:scale(1.12) rotate(-2deg)}}
.leaf.blast{transition:transform .6s cubic-bezier(.3,0,.7,1),opacity .6s ease-in;transform:translate(80vw,-55vh) rotate(75deg) scale(.5)!important;opacity:0}
.phark{display:block;width:170px;height:129px;margin:-6px 0 -18px auto;position:relative;z-index:2}

/* Hark carries each step in */
.curtain{position:fixed;inset:0;z-index:45;will-change:transform;backface-visibility:hidden}
.runner{position:fixed;left:0;top:0;width:200px;height:135px;z-index:46;pointer-events:none;will-change:transform}
.gstage{animation:pushin .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pushin{from{transform:translateX(-120vw)}}

/* the calendar board: dark green field, white doors */
.board{background:var(--green)}
.board .stats{border-bottom-color:rgba(255,255,255,.35);color:#fff}
.board .stats div+div{border-left-color:rgba(255,255,255,.35)}
.board .stats b,.board .stats div:nth-child(n) b{color:var(--gold)}
.board .stats span{color:rgba(255,255,255,.75)}
.board .wk header{border-top-color:var(--gold)}
.board .wk h2{color:#fff}
.board .wk header span{color:rgba(255,255,255,.7)}
.board .door{background:#fff;color:var(--ink);box-shadow:none}
.board .door:not(.open):not(.now):not(.done){background:#fff;color:#BDB7AC}
.board .door.open{background:#fff;color:var(--ink)}
.board .door.missed span{color:var(--red)}
.board .door.done{background:var(--red);color:#fff}
.board .door.now{background:var(--tonight);color:#fff;box-shadow:inset 0 0 0 3px #fff}
.board .box{background:var(--red);color:#fff}
.board .box .rv,.board .box .rh{background:var(--gold)}
.board .box .bow{background:#fff}

/* gold type on every dark field */
.hero,.hero .cap{color:var(--gold)}
.board .stats,.board .stats span,.board .wk h2,.board .wk header span{color:var(--gold)}
.board .door.done,.board .door.done span{color:var(--gold)}
.board .box,.board .box b,.board .box .cap{color:var(--gold)}
.board .box .rv,.board .box .rh{background:rgba(255,200,61,.35)}
.night.t-verse,.night.t-idea,.night.t-gift,.night.t-prayer,.night.t-done{--fg:var(--gold);--sub:rgba(255,200,61,.8);--rule:rgba(255,200,61,.5)}
.night.t-prayer{--btnbg:var(--gold)}
.night.t-verse,.night.t-idea,.night.t-gift,.night.t-done{--btnbg:var(--gold);--btnfg:var(--ink)}
.also .cap,.night .step{color:var(--gold)}
.night.t-teach .step,.night.t-hymn .step{color:var(--acc)}
.tabs .tab.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<script>
"use strict";
/* ===================== CONTENT ===================== */
const HYMNS={
hark:{t:"Hark! The Herald Angels Sing",v:[
`Hark! the herald angels sing,
"Glory to the newborn King;
Peace on earth, and mercy mild,
God and sinners reconciled!"
Joyful, all ye nations, rise,
Join the triumph of the skies;
With th'angelic host proclaim,
"Christ is born in Bethlehem!"
Hark! the herald angels sing,
"Glory to the newborn King."`,
`Christ, by highest heaven adored;
Christ, the everlasting Lord;
Late in time behold Him come,
Offspring of the Virgin's womb.
Veiled in flesh the Godhead see;
Hail th'incarnate Deity,
Pleased as man with men to dwell,
Jesus, our Emmanuel.
Hark! the herald angels sing,
"Glory to the newborn King."`,
`Hail the heaven-born Prince of Peace!
Hail the Sun of Righteousness!
Light and life to all He brings,
Risen with healing in His wings.
Mild He lays His glory by,
Born that man no more may die,
Born to raise the sons of earth,
Born to give them second birth.
Hark! the herald angels sing,
"Glory to the newborn King."`]},
faithful:{t:"O Come, All Ye Faithful",v:[
`O come, all ye faithful, joyful and triumphant,
O come ye, O come ye to Bethlehem;
Come and behold Him, born the King of angels;
O come, let us adore Him,
O come, let us adore Him,
O come, let us adore Him, Christ the Lord.`,
`Sing, choirs of angels, sing in exultation,
Sing, all ye citizens of heaven above;
Glory to God, all glory in the highest;
O come, let us adore Him,
O come, let us adore Him,
O come, let us adore Him, Christ the Lord.`,
`Yea, Lord, we greet Thee, born this happy morning;
Jesus, to Thee be all glory given;
Word of the Father, now in flesh appearing;
O come, let us adore Him,
O come, let us adore Him,
O come, let us adore Him, Christ the Lord.`]},
joy:{t:"Joy to the World",v:[
`Joy to the world! the Lord is come;
Let earth receive her King;
Let every heart prepare Him room,
And heaven and nature sing,
And heaven and nature sing,
And heaven, and heaven and nature sing.`,
`Joy to the earth! the Savior reigns;
Let men their songs employ;
While fields and floods, rocks, hills and plains
Repeat the sounding joy,
Repeat the sounding joy,
Repeat, repeat the sounding joy.`,
`He rules the world with truth and grace,
And makes the nations prove
The glories of His righteousness,
And wonders of His love,
And wonders of His love,
And wonders, wonders of His love.`]},
town:{t:"O Little Town of Bethlehem",v:[
`O little town of Bethlehem,
How still we see thee lie!
Above thy deep and dreamless sleep
The silent stars go by;
Yet in thy dark streets shineth
The everlasting Light;
The hopes and fears of all the years
Are met in thee tonight.`,
`How silently, how silently,
The wondrous gift is given!
So God imparts to human hearts
The blessings of His heaven.
No ear may hear His coming,
But in this world of sin,
Where meek souls will receive Him still,
The dear Christ enters in.`,
`O holy Child of Bethlehem,
Descend to us, we pray;
Cast out our sin and enter in,
Be born in us today.
We hear the Christmas angels
The great glad tidings tell;
O come to us, abide with us,
Our Lord Emmanuel!`]},
emmanuel:{t:"O Come, O Come, Emmanuel",v:[
`O come, O come, Emmanuel,
And ransom captive Israel,
That mourns in lonely exile here
Until the Son of God appear.
Rejoice! Rejoice! Emmanuel
Shall come to thee, O Israel.`,
`O come, Thou Dayspring, come and cheer
Our spirits by Thine advent here;
Disperse the gloomy clouds of night,
And death's dark shadows put to flight.
Rejoice! Rejoice! Emmanuel
Shall come to thee, O Israel.`,
`O come, Thou Key of David, come
And open wide our heavenly home;
Make safe the way that leads on high,
And close the path to misery.
Rejoice! Rejoice! Emmanuel
Shall come to thee, O Israel.`]},
expected:{t:"Come, Thou Long-Expected Jesus",v:[
`Come, Thou long-expected Jesus,
Born to set Thy people free;
From our fears and sins release us,
Let us find our rest in Thee.
Israel's strength and consolation,
Hope of all the earth Thou art;
Dear desire of every nation,
Joy of every longing heart.`,
`Born Thy people to deliver,
Born a child and yet a King,
Born to reign in us forever,
Now Thy gracious kingdom bring.
By Thine own eternal Spirit
Rule in all our hearts alone;
By Thine all-sufficient merit,
Raise us to Thy glorious throne.`]},
silent:{t:"Silent Night",v:[
`Silent night, holy night,
All is calm, all is bright
Round yon virgin mother and child.
Holy Infant, so tender and mild,
Sleep in heavenly peace,
Sleep in heavenly peace.`,
`Silent night, holy night,
Shepherds quake at the sight;
Glories stream from heaven afar,
Heavenly hosts sing Alleluia!
Christ the Savior is born,
Christ the Savior is born.`,
`Silent night, holy night,
Son of God, love's pure light
Radiant beams from Thy holy face,
With the dawn of redeeming grace,
Jesus, Lord, at Thy birth,
Jesus, Lord, at Thy birth.`]}
};

/* m = message, v = verse ref, vt = verse text (KJV), c = credit, y = year, p = place, h = hymn id,
   pt = Praise|Ask, pp = prayer prompt, pr = prayer to read aloud, t = teaching paragraphs,
   s = surprise in the gift, audio = optional mp3 URL (ElevenLabs narration goes here) */
const NIGHTS=[
{m:"He became what we are so we could share his life",v:"2 Corinthians 8:9",y:"c. 180",p:"Lyon, Gaul",c:"Irenaeus, Against Heresies, Book V",h:"hark",pt:"Praise",pp:"Thank Jesus for one part of human life he took on",
vt:"For ye know the grace of our Lord Jesus Christ, that, though he was rich, yet for your sakes he became poor, that ye through his poverty might be rich.",
pr:"Lord Jesus, you did not stay far off. You became what we are: you were hungry, tired, a child in a family. Thank you. Bring us all the way home to share your life. Amen.",
s:"Tomorrow's mission: when you feel tired or hungry tomorrow, remember that he felt it too, and say thank you.",
t:[`Tonight's message is almost as old as the church itself. Around the year 180, in the city of Lyon, a pastor named Irenaeus put it in one sentence.`,
`Follow the one true and steadfast Teacher, the Word of God, our Lord Jesus Christ. Out of his boundless love he became what we are, so that he might bring us to be what he is.`,
`Why did he have to come that way? Because there was no other way for us to learn the things of God. Our Teacher, who is the Word, had to become a man. No one else could show us the Father except the Father's own Word. For who else has known the mind of the Lord? Who else has been his counselor?`,
`And we could not have learned in any other way than by seeing our Teacher with our own eyes and hearing his voice with our own ears. He came close so that we could copy what he does and do what he says, and so share life with him.`,
`We had wandered off and been taken captive. So the Word of God, mighty in every way and never failing in justice, came to win back what was his own. He did not do it by force. He did it by giving. The Lord redeemed us with his own blood. He gave his soul for our souls and his body for our bodies. And he poured out the Spirit of the Father to join God and people together: bringing God down to us through the Spirit, and lifting us up to God by his own becoming flesh.`,
`So this is where Advent begins. He did not shout directions from far away. He came all the way down to where we are, and he will not stop until we share his life.`]},
{m:"The King moved into our city, so the whole city is safe",v:"Hebrews 2:14-15",y:"c. 320",p:"Alexandria, Egypt",c:"Athanasius, On the Incarnation",h:"faithful",pt:"Ask",pp:"Pray for one person facing fear or grief, by name",
vt:"Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same; that through death he might destroy him that had the power of death, that is, the devil; and deliver them who through fear of death were all their lifetime subject to bondage.",
pr:"King Jesus, you moved into our city and you have not left. Be near tonight to the one we name, who is afraid or grieving. Let them know the King is living here. Amen.",
s:"Christmas cracker: What do you call a king who moves into your street? A good neighbor. (Tonight, that one is true.)",
t:[`Tonight we are in Alexandria, in Egypt, in the early 300s. The message is this: the King moved into our city, so the whole city is safe.`,
`The Word of God was never far from us. He fills all things. But he saw the human race, the people he had made, wasting away. Death ruled over us, and what God had made was coming undone. He could not bear that death should have the mastery, or that his Father's work in us should come to nothing. So he took pity on us and came down to our level.`,
`He took a body, and a body no different from ours. He made it his own, a temple to live in. And because all of us were under the sentence of death, he gave that body over to death in place of all, and offered it to the Father. He did this out of sheer love for us, so that the law of death might be used up and lose its power. He turned us back from ruin toward life, and by his rising he makes death vanish from us like straw in a fire.`,
`Think of a great king who enters a large city and makes his home in one of its houses. The whole city is honored. No enemy or bandit dares come down on it any more, because the king is living there. One house holds him, and every house is safer for it.`,
`So it is with the King of all. He has come into our country and lived in one body among us. Since then, the whole plot of the enemy against the human race has been stopped, and the decay of death that once held us has begun to lose its grip.`,
`The King has moved in. That is why we do not have to be afraid.`]},
{m:"Two comings: the manger, then the clouds",v:"Titus 2:11-13",y:"c. 350",p:"Jerusalem",c:"Cyril of Jerusalem, Catechetical Lecture 15",h:"joy",pt:"Ask",pp:"Name one thing to set right before he comes",
vt:"For the grace of God that bringeth salvation hath appeared to all men, teaching us that, denying ungodliness and worldly lusts, we should live soberly, righteously, and godly, in this present world; looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ.",
pr:"Lord Jesus, you came once in a manger and you are coming again in glory. Show each of us one thing to set right, and give us the courage to do it this week. Come, Lord Jesus. Amen.",
s:"Tomorrow's mission: set right the one thing you named. A text, an apology, a chore. Small counts.",
t:[`Jerusalem, about the year 350. A pastor is teaching people who are new to the faith. His message: there are two comings.`,
`We preach not one coming of Christ only, but a second as well, far more glorious than the first. The first showed his patience. The second will bring the crown of God's kingdom.`,
`Almost everything about our Lord Jesus Christ is twofold. There are two births: one from God before the ages, and one from a virgin at the end of the ages. There are two descents: one quiet, like rain falling on a fleece, and one still to come, in the open, for all to see.`,
`In his first coming he was wrapped in swaddling clothes and laid in a manger. In his second he is clothed in light as with a robe. In his first coming he endured the cross and thought nothing of its shame. In his second he comes in glory, with an army of angels around him.`,
`So we do not rest in his first coming alone. We look for his second too. At his first coming we said, Blessed is he who comes in the name of the Lord. At his second we will say it again, and go out with the angels to meet our Master, and worship him.`,
`The Savior is coming, not to be judged again, but to judge those who judged him. The first time, he came to teach people gently and win them over. The next time, whether people wish it or not, they will have him as their King.`,
`So Advent looks two ways. Back to the manger, with thanks. Forward to the clouds, with hope.`]},
{m:"The Mighty One became a baby; the Shepherd became a lamb",v:"Isaiah 7:14",y:"c. 360",p:"Nisibis, Syria",c:"Ephrem the Syrian, Hymns on the Nativity",h:"town",pt:"Praise",pp:"Take turns naming titles of Jesus",
vt:"Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.",
pr:"Jesus, you are Immanuel, Shepherd, Lamb, Light, King, Savior. Every name we have said tonight is true, and you are more than all of them. We praise you. Amen.",
s:"Sticker: IMMANUEL. It means God with us. Say it three times fast.",
t:[`Tonight's message comes from a song. In Syria in the 300s, a teacher named Ephrem taught his church by writing hymns for them to sing. This is one of them.`,
`Today the voice that Isaiah spoke long ago has come true. The psalm that David once sang is fulfilled today. The word that Micah once spoke has today come to pass: for out of Bethlehem a Shepherd has come, and his staff rules over souls. The star has risen out of Jacob, just as was promised. The hidden Light has come down, and his beauty has shone out from a human body.`,
`This is the day that made the prophets glad. What they longed to see, we see. The watchers in heaven are awake and singing tonight, so let us not sleep through it.`,
`Look at who is lying here. The Mighty One has become a small child. The one who gives food to everything that lives is hungry. The one who holds the whole world in his hand is held in his mother's arms. The Shepherd of all has become a lamb. The one who is rich beyond counting has come down to be poor for us.`,
`He came down quietly. He was not ashamed to become small. And because he became small, small people like us can come near him.`,
`On this day, let no one be proud, for the Lord of all has made himself low. On this day, let no one hold a grudge, for God has come to make peace with those who wronged him. On this day the door of heaven is open to our prayers. So let us ask.`]},
{m:"Christ is born, so go out to meet him",v:"Isaiah 9:2",y:"c. 380",p:"Constantinople",c:"Gregory of Nazianzus, Oration 38",h:"faithful",pt:"Praise",pp:"Praise only tonight: no requests",
vt:"The people that walked in darkness have seen a great light: they that dwell in the land of the shadow of death, upon them hath the light shined.",
pr:"Christ is born: we give you glory. Christ has come from heaven: we come out to meet you. Light of the world, we praise you, and tonight we ask for nothing but you. Amen.",
s:"Tomorrow's mission: the first time you step outside tomorrow, look up and say, Christ is born, give him glory.",
t:[`Constantinople, about the year 380, on Christmas Day. The preacher opens with a shout. His message: Christ is born, so go out to meet him.`,
`Christ is born: give him glory! Christ comes from heaven: go out to meet him! Christ is on earth: be lifted up! Sing to the Lord, all the earth. Let the heavens rejoice and the earth be glad, because of him who is of heaven and now is on earth. Christ is in the flesh: rejoice with trembling and with joy. With trembling because of your sins, with joy because of your hope.`,
`Again the darkness is over. Again the light is made. The people who sat in darkness have seen a great light. The old has passed away; look, everything has become new. The shadows flee, and the truth comes in.`,
`The one who is without flesh takes flesh. The Word puts on a body. The invisible is seen. The one no hand could touch is touched. The timeless one has a beginning. The Son of God becomes the Son of Man: Jesus Christ, the same yesterday, today and forever.`,
`This is our festival. This is what we celebrate today: the coming of God to us, so that we might go back to God. So that we might put off the old self and put on the new. As we died in Adam, so we may live in Christ, be born with Christ, and rise with him.`,
`So let us keep the feast, not as a party for the world, but in a godly way. Not as a day of our weakness, but of our healing. Not as a day of being made, but of being made new.`,
`Run with the star. Bring your gifts with the wise men. Give glory with the shepherds. Sing with the angels. Christ is born: give him glory.`]},
{m:"The Maker was made man: Bread hungry, Fountain thirsty",v:"John 1:14",y:"c. 400",p:"Hippo, North Africa",c:"Augustine, Sermon 191 (fresh translation)",h:"hark",pt:"Praise",pp:"Thank him for one weakness he chose",
vt:"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.",
pr:"Maker of all, you chose to be made small. You chose hunger, thirst, tiredness and death, and you chose them for us. For each weakness we have named tonight: thank you. Amen.",
s:"Christmas cracker: Who made the stars and then needed a nap? Read tonight's list again. It is not a joke.",
t:[`North Africa, about the year 400. It is Christmas morning, and a pastor named Augustine stands up to preach. His message: the Maker was made man.`,
`The Word of the Father, through whom time itself was made, became flesh and gave us his birthday in time. He, without whose say-so not a single day rolls by, chose to have one day for his own human birth. With the Father, he comes before all the ages. Born of a mother on this day, he stepped into the passing years.`,
`The Maker of man was made man.`,
`So that the Ruler of the stars might be nursed as a baby. So that the Bread might be hungry. So that the Fountain might be thirsty. So that the Light might sleep. So that the Way might be tired from the journey.`,
`So that the Truth might be accused by false witnesses. So that the Judge of the living and the dead might be judged by a mortal judge. So that Justice might be condemned by the unjust.`,
`So that the Vine might be crowned with thorns. So that the Foundation might be hung on a tree. So that Strength might be made weak. So that the Healer might be wounded. So that Life might die.`,
`He bore all these things for us, things he did not deserve, to set free people who did not deserve it. He had done nothing to earn such evils. We had done nothing to earn such good.`,
`Pick one line tonight and stay there for a moment. The Bread was hungry. The Light slept. Life died. All of it, for us.`]},
{m:"Joy is for everyone, so remember who you now are",v:"Colossians 1:12-13",y:"c. 450",p:"Rome",c:"Leo the Great, Sermon 21",h:"joy",pt:"Ask",pp:"Ask for help to leave one old habit behind",
vt:"Giving thanks unto the Father, which hath made us meet to be partakers of the inheritance of the saints in light: who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son.",
pr:"Father, you rescued us from the dark and brought us into the kingdom of your Son. Help us remember who we are now. Give us strength to leave behind the habit we have named. Amen.",
s:"Tomorrow's mission: when the old habit knocks, say out loud, I remember who I am.",
t:[`Rome, about the year 450. Christmas Day. The message: joy is for everyone, so remember who you now are.`,
`Our Savior, dearly beloved, was born today: let us be glad. There is no room for sadness on the birthday of Life itself, the Life that swallows up the fear of death and brings us the joy of a promised eternity.`,
`No one is shut out from this happiness. Everyone has the same reason for joy, because our Lord, the destroyer of sin and death, found no one free from guilt, and so he came to set everyone free. Let the saint rejoice, for he is close to his prize. Let the sinner be glad, for he is invited to be forgiven. Let the outsider take courage, for he is called to life.`,
`So let us give thanks to God the Father, through his Son, in the Holy Spirit. Because of the great mercy with which he loved us, he took pity on us; and when we were dead in our sins, he made us alive together with Christ, so that in him we might be a new creation.`,
`Let us then put off the old self with its ways. And since we have been given a share in the birth of Christ, let us turn our backs on the works of the flesh.`,
`Christian, remember your dignity. You have been made a sharer in God's own nature. Do not go back to your old, low ways by living beneath what you are. Remember whose body you belong to, and who is its Head. Remember that you were rescued from the power of darkness and brought into the light and kingdom of God.`]},

/* Teachings for nights 1-7: the author's own words in modern English, first person, no narrator.
   Rendered from the public-domain English translations (and, for night 6, from the Latin). */
const WHO=["Irenaeus, pastor in Lyon","Athanasius, pastor in Alexandria","Cyril, pastor in Jerusalem","Ephrem, hymn writer in Syria","Gregory, preacher in Constantinople","Augustine, pastor in Hippo","Leo, pastor in Rome"];
const TEACH=[
[`Follow the only true and steadfast Teacher, the Word of God, our Lord Jesus Christ. Through his boundless love he became what we are, so that he might bring us to be what he is himself.`,
`There is no other way we could have learned the things of God, unless our Teacher, who is the Word, had become man. No one else had the power to reveal to us the things of the Father, except his own Word. For who else has known the mind of the Lord? Who else has been his counselor?`,
`Again, we could have learned in no other way than by seeing our Teacher, and hearing his voice with our own ears. So that, by copying his works and doing his words, we might have communion with him, and receive growth from the one who is perfect, who was before all creation.`,
`We were only lately made, by the one who alone is supremely good, the one who has the gift of immortality. We were formed after his likeness, and chosen beforehand in the Father's foreknowledge, we who did not yet exist. And at the appointed time we have received the blessings of salvation through the ministry of the Word, who is perfect in all things: the mighty Word, and truly man. He redeemed us by his own blood, giving himself as a ransom for those who had been led into captivity.`,
`The enemy ruled over us unjustly. Though by nature we belonged to almighty God, he tore us away and made us his own followers. But the Word of God, powerful in all things and never lacking in his own justice, turned rightly against that rebellion and won back from it what was his own. He did not do it by force, the way the enemy had seized us at the beginning, greedily snatching what was not his. He did it by persuasion, as is fitting for a God of wisdom, who does not use violence to get what he desires. So justice was not broken, and the ancient handiwork of God was not left to perish.`,
`So the Lord has redeemed us through his own blood, giving his soul for our souls and his flesh for our flesh. And he has poured out the Spirit of the Father to unite God and man: bringing God down to us through the Spirit, and raising us up to God by his own becoming flesh. At his coming he gave us true and lasting immortality, through communion with God.`],
[`The Word of God was never far from us before. No part of creation is left empty of him; he fills all things everywhere. But now he comes down to us in a new way, out of love, to show himself to us.`,
`He saw the human race, the people he had made, wasting away, and death ruling over them. He saw that what God had made was perishing. He could not bear that death should have the mastery. So he took pity on our race, and had mercy on our weakness, and came down to where we are.`,
`He took a body for himself, a body no different from ours. He made it his own, as a temple to live in. And because all of us were under the sentence of death, he gave his body over to death in place of all, and offered it to the Father. He did this out of sheer love for us.`,
`The Word saw that our ruin could be undone only by death. Yet he, the Word, being immortal and the Son of the Father, could not die. So he took to himself a body that could die, so that this body, belonging to the Word who is above all, might be worthy to die in place of all. And because the Word had come to live in it, it would remain incorruptible, and from then on, by the grace of the resurrection, ruin would be held back from everyone.`,
`Think of a great king who enters a large city and makes his home in one of its houses. That city is held in high honor. No enemy or bandit comes down on it any more to overthrow it. It is counted worthy of every care, because the king has taken up his home in a single house there. So it has been with the King of all.`,
`For now that he has come to our realm, and made his home in one body among his own, the whole plot of the enemy against humankind is stopped, and the ruin of death that once held us is undone. The human race would have gone to ruin, if the Lord and Savior of all, the Son of God, had not come among us to put an end to death.`],
[`We do not preach just one coming of Christ, but a second as well, far more glorious than the first. The first showed us his patience. The second brings with it the crown of God's kingdom.`,
`Nearly everything about our Lord Jesus Christ comes in pairs. He was born twice: once from God before time began, and once from a virgin at the close of the ages. His comings are twofold as well: one unseen, like rain falling on a fleece, and a second, open and visible, which is still to come.`,
`At his first coming he was wrapped in strips of cloth and laid in a manger. At his second he will clothe himself in light as in a garment. At his first coming he endured the cross, scorning its shame. At his second he will come with an army of angels, receiving glory.`,
`So we do not rest only on his first coming. We look forward to his second as well. When he first came we said, Blessed is he who comes in the name of the Lord. At his second coming we will say the same again, so that when we meet our Master with the angels we may worship him and say, Blessed is he who comes in the name of the Lord.`,
`The Savior is coming, not to be judged again, but to judge those who judged him. He who kept silent when he was judged will remind the wrongdoers of what they dared to do at the cross, and will say, You did these things, and I kept silent. The first time he came to teach people by persuasion. But this time, whether they want him or not, they will have him as their King.`,
`The prophet Malachi speaks of both. Of the first he says, The Lord whom you seek will suddenly come to his temple. And of the second: But who can endure the day of his coming? Who can stand when he appears? For he comes like a refiner's fire.`,
`Paul also points to these two comings when he writes to Titus. The grace of God has appeared, bringing salvation to all people, teaching us to live upright and godly lives in this present world, while we look for the blessed hope, the appearing of the glory of our great God and Savior, Jesus Christ. Do you see how he speaks of a first coming, for which he gives thanks, and of a second, for which we are waiting?`],
[`This is the day that made them glad: the prophets, the kings and the priests. For on this day their words came true, and everything they foretold was carried out.`,
`On this day the Virgin brought forth Immanuel in Bethlehem. The voice that Isaiah spoke long ago became real today.`,
`The psalm that David once sang was fulfilled today. The word that Micah once spoke has truly come to pass today. For a Shepherd came out of Bethlehem, and his staff rules over souls.`,
`Look! A star has shone out from Jacob, and a ruler has risen up from Israel. The prophecy that Balaam spoke has found its meaning today.`,
`The hidden Light came down, and his beauty shone out from a body. The light that Zechariah spoke of shone today in Bethlehem. The Light of the kingdom has risen in the city of the King.`,
`The blessing that Jacob gave has reached its fulfillment today. That tree of life brings hope to people who must die.`,
`Today the Child was born, and his name was called Wonder. For it is a wonder that God shows himself as a baby.`,
`He came up like a root out of dry ground. What was said in secret has been done in the open today.`,
`Blessed be the True One, who came from the Father of truth, and fulfilled the words of the true prophets. They were all accomplished, in truth.`,
`From your treasure house, Lord, from the storehouses of your Scriptures, bring out the names of the righteous of old, who longed to see your coming.`],
[`Christ is born: glorify him! Christ comes from heaven: go out to meet him! Christ is on earth: be lifted up! Sing to the Lord, all the earth. And, to say both in one breath: let the heavens rejoice and the earth be glad, because he who is of heaven is now on earth.`,
`Christ is in the flesh: rejoice, with trembling and with joy. With trembling because of your sins. With joy because of your hope.`,
`Who does not worship him who is from the beginning? Who does not glorify him who is the last?`,
`Again the darkness is past. Again light is made. Let the people who sat in the darkness of ignorance see the great Light of full knowledge. Old things have passed away; look, all things have become new. The letter gives way, and the Spirit comes to the front. The shadows flee, and the Truth comes in upon them.`,
`The laws of nature are overturned. Christ commands it; let us not set ourselves against him. Clap your hands, all you peoples, because to us a child is born, and to us a son is given, and the government rests on his shoulder. Let John cry out, Prepare the way of the Lord. I too will cry out the power of this day. He who is without flesh takes flesh. The Son of God becomes the Son of Man: Jesus Christ, the same yesterday, today and forever.`,
`This is the festival we keep. This is what we celebrate today: the coming of God to man, so that we might go out to God, or rather, to say it more truly, go back to him. So that, putting off the old self, we might put on the new. And just as we died in Adam, so we might live in Christ: born with Christ, crucified with him, buried with him, and raised with him.`,
`So let us keep the feast, not the way the world throws a party, but in a godly way. Not in the way of this world, but in a way above this world. Not as our own, but as belonging to him who is ours, or rather, to our Master. Not as a day of weakness, but of healing. Not as a day of being made, but of being made new.`],
[`The Word of the Father, through whom time itself was made, became flesh, and made for us his birthday in time. He, without whose divine say-so not a single day rolls by, willed to have one day for his human birth.`,
`With the Father, he comes before all the ages. Born of a mother on this day, he stepped into the passing of the years.`,
`The Maker of man was made man.`,
`So that the Ruler of the stars might nurse at the breast. So that the Bread might hunger. So that the Fountain might thirst. So that the Light might sleep. So that the Way might be wearied by the journey.`,
`So that the Truth might be accused by false witnesses. So that the Judge of the living and the dead might be judged by a mortal judge. So that Justice might be condemned by the unjust. So that Discipline might be beaten with whips.`,
`So that the Cluster of grapes might be crowned with thorns. So that the Foundation might be hung on a tree. So that Strength might be made weak. So that Health might be wounded. So that Life might die.`,
`He bore these things, and things like them, for us, though he did not deserve them, to set free those who did not deserve it. He had done nothing to earn such evils. We had done nothing to earn such good.`],
[`Our Savior, dearly beloved, was born today: let us rejoice. There is no proper place for sadness on the birthday of Life itself, the Life that ends our dread of death and brings us the joy of the eternity he has promised.`,
`No one is shut out from a share in this happiness. All of us have one and the same reason for joy. For our Lord, the destroyer of sin and death, finds no one free from guilt, and so he has come to set us all free.`,
`Let the saint rejoice, for he is drawing near to victory. Let the sinner be glad, for he is invited to pardon. Let the outsider take heart, for he is called to life.`,
`For the Son of God, at the time appointed by the unsearchable wisdom of God, took on our human nature in order to reconcile it to its Maker, so that the devil, the inventor of death, might be defeated through the very nature he had once defeated.`,
`So, dearly beloved, let us give thanks to God the Father, through his Son, in the Holy Spirit. In his great mercy, with which he loved us, he has had pity on us. When we were dead in our sins he made us alive together with Christ, so that in him we might be a new creation and a new work of his hands.`,
`Let us then put off the old self with its deeds. And since we have been given a share in the birth of Christ, let us turn away from the works of the flesh.`,
`Christian, recognize your dignity. You have become a sharer in the divine nature: do not go back to your former lowness by living beneath what you are. Remember the Head, and the Body of which you are a part. Keep in mind that you were rescued from the power of darkness and brought out into the light and the kingdom of God.`,
`The price paid for you is the blood of Christ. He who redeemed you in mercy will judge you in truth; and he reigns with the Father and the Holy Spirit for ever and ever. Amen.`]
];
